server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # The API runs in a separate container; Docker resolves "backend" from the
    # compose service name. No trailing slash on proxy_pass, so the full
    # /api/v1/... path reaches the Go server unchanged.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # The shell must never be cached, or a deploy leaves clients on old asset
    # URLs that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths fall through to the shell rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
}
